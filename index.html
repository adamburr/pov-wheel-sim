<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POV Wheel Simulator</title>
    <style>
      :root { color-scheme: dark; --panel: rgba(12, 14, 20, 0.82); --text: #d8dde6; --muted: #8b93a3; --warn: #ffb547; }
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; color: var(--text); }
      #app { position: fixed; inset: 0; }
      #stats { position: fixed; left: 12px; top: 12px; width: 330px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
      #stats h1 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
      #stats table { border-collapse: collapse; width: 100%; }
      #stats td { padding: 1px 0; vertical-align: top; }
      #stats td:first-child { color: var(--muted); white-space: nowrap; padding-right: 10px; }
      #stats ul { margin: 8px 0 0; padding-left: 16px; color: var(--warn); }
      #stats li { margin-bottom: 4px; }
      #stats.collapsed table, #stats.collapsed ul { display: none; }
      #stats h1 { cursor: pointer; user-select: none; }
      #buffer { position: fixed; left: 12px; bottom: 150px; background: var(--panel); border-radius: 8px; padding: 8px; display: none; }
      #buffer canvas { display: block; image-rendering: pixelated; width: 330px; height: 140px; }
      #buffer div { color: var(--muted); margin-bottom: 4px; }
      #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 20px; background: rgba(0, 120, 255, 0.15); border: 3px dashed #4aa3ff; pointer-events: none; }
      #ride { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: var(--panel); border-radius: 12px; padding: 12px 16px 14px; backdrop-filter: blur(6px); user-select: none; }
      #ride .readout { display: flex; align-items: baseline; gap: 8px; }
      #ride-speed { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
      #ride-unit { font-size: 16px; color: var(--muted); }
      #ride-status { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
      #ride-slider { width: 100%; height: 28px; margin: 10px 0 8px; accent-color: #4aa3ff; cursor: pointer; }
      #ride .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #ride button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid #3a4152; background: #1b2030; color: var(--text); cursor: pointer; }
      #ride button:hover { background: #262d42; }
      #ride label { margin-left: auto; font-size: 14px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
      #ride input[type=checkbox] { width: 18px; height: 18px; accent-color: #4aa3ff; }
      @media (max-width: 700px) { #stats { width: calc(100% - 48px); max-height: 35%; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="stats"></div>
    <div id="buffer"><div>Firmware column buffer (x = column, y = strip/LED)</div><canvas></canvas></div>
    <div id="ride">
      <div class="readout"><span id="ride-speed">0.0</span><span id="ride-unit">mph</span><span id="ride-status"></span></div>
      <input id="ride-slider" type="range" min="0" max="40" step="0.5" aria-label="Bicycle speed" />
      <div class="row">
        <button id="ride-brake" type="button">🛑 Brake</button>
        <button id="ride-go" type="button">▶ Ride</button>
        <label><input id="ride-city" type="checkbox" /> 🚦 City stop-and-go</label>
      </div>
    </div>
    <div id="drop">Drop an image to display it on the wheel</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
