<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POV Wheel Simulator</title>
    <style>
      :root { color-scheme: dark; --panel: rgba(12, 14, 20, 0.82); --solid: #0e1118; --line: #262c3a; --text: #d8dde6; --muted: #8b93a3; --warn: #ffb547; --accent: #4aa3ff; --panel-w: min(380px, 100vw); }
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; color: var(--text); }
      button { font: inherit; color: var(--text); }
      #app { position: fixed; inset: 0; }
      #buffer { position: fixed; left: 12px; bottom: 190px; background: var(--panel); border-radius: 8px; padding: 8px; display: none; }
      #buffer canvas { display: block; image-rendering: pixelated; width: 330px; height: 140px; }
      #buffer div { color: var(--muted); margin-bottom: 4px; }
      /* Roadside strip: a label over its corner, and it keeps drags from turning the main camera. */
      #strip-frame { position: fixed; box-sizing: border-box; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
      #strip-frame[hidden] { display: none; }
      #strip-frame span { position: absolute; left: 8px; bottom: 6px; padding: 2px 8px; border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 12px; pointer-events: none; }
      /* A destructive button armed by its first click; a second click within 4 s carries it out. */
      body .armed, body .lil-gui .controller.armed button { background: #6a1f2a !important; border-color: #b03a4a !important; color: #fff !important; }
      #toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; box-sizing: border-box; max-width: min(520px, calc(100% - 32px)); padding: 10px 14px; border-radius: 10px; background: #3a1d24; border: 1px solid #a03a4a; font-size: 14px; }
      #toast[hidden] { display: none; }
      #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 20px; background: rgba(0, 120, 255, 0.15); border: 3px dashed var(--accent); pointer-events: none; }

      /* Ride panel: the preset button (the wheel's one hardware button), then speed and riding. */
      /* Two packed rows, as wide as their contents: the preset and riding buttons, then the speed.
         Sized to fit a 375 px phone (iPhone mini) without wrapping. */
      #ride { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); box-sizing: border-box; display: grid; gap: 6px; background: var(--panel); border-radius: 12px; padding: 8px 10px; backdrop-filter: blur(6px); user-select: none; transition: left 0.2s; }
      #ride .row { display: flex; align-items: center; gap: 6px; }
      #ride-brake { margin-left: auto; }
      #preset-name { flex: 0 1 auto; max-width: 11em; min-width: 0; text-align: left; font-size: 14px; font-weight: 600; background: none !important; border: 0 !important; padding: 2px 0 !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #preset-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      #ride #preset-next { background: #1d3a5f; border-color: #2f5d93; font-weight: 600; }
      #ride #preset-next:hover { background: #24497a; }
      #ride-speed { min-width: 2.3em; text-align: right; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
      #ride-unit { font-size: 12px; color: var(--muted); }
      #ride-slider { flex: 1 1 220px; min-width: 80px; height: 24px; margin: 0 4px; accent-color: var(--accent); cursor: pointer; }
      #ride-status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #ride button { font-size: 13px; padding: 5px 12px; border-radius: 8px; border: 1px solid #3a4152; background: #1b2030; cursor: pointer; white-space: nowrap; }
      #ride button:hover { background: #262d42; }
      #ride label { margin-left: 2px; font-size: 13px; display: flex; gap: 5px; align-items: center; cursor: pointer; white-space: nowrap; }
      #ride input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
      @media (max-width: 420px) {
        #ride { bottom: calc(8px + env(safe-area-inset-bottom)); padding: 6px 8px; }
        #ride .row { gap: 5px; }
        #ride button { padding: 5px 8px; }
      }

      /* Settings panel: a side panel on wide screens, a bottom sheet on phones. */
      /* On the follow view, below the roadside strip when that's at the top (--view-top, set by main.ts). */
      #panel-toggle { position: fixed; top: calc(var(--view-top, 0px) + 10px); right: 10px; z-index: 2; padding: 9px 14px; font-size: 15px; border-radius: 10px; border: 1px solid #3a4152; background: var(--panel); backdrop-filter: blur(6px); cursor: pointer; }
      #panel-toggle:hover { background: #1b2030; }
      #panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 3; display: flex; flex-direction: column; background: var(--solid); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, 0.4); transform: translateX(100%); visibility: hidden; transition: transform 0.2s, visibility 0.2s; }
      body.panel-open #panel { transform: none; visibility: visible; }
      body.panel-open #panel-toggle { display: none; }
      body.panel-open #ride { left: calc((100% - var(--panel-w)) / 2); }
      #panel header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px 12px; }
      #panel header .label { color: var(--muted); font-size: 13px; margin-right: 2px; }
      #panel header button, .preset-actions button { font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid #3a4152; background: #1b2030; cursor: pointer; }
      #panel header button:hover, .preset-actions button:hover { background: #262d42; }
      #panel-close { margin-left: auto; padding: 6px 10px !important; }
      #panel nav { display: flex; border-bottom: 1px solid var(--line); }
      #panel nav button { flex: 1; padding: 10px 4px; font-size: 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
      #panel nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
      .pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }
      #panel footer { flex: none; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; }
      #panel footer a { color: var(--muted); text-decoration: none; }
      #panel footer a:hover { color: inherit; text-decoration: underline; }
      .pane[hidden] { display: none; }
      .pane .hint { margin: 10px 12px 0; color: var(--muted); font-size: 13px; }
      #preset-list { list-style: none; margin: 0; padding: 8px 8px 0; display: grid; gap: 4px; }
      #preset-list li { display: flex; gap: 4px; }
      #preset-list button { border-radius: 8px; border: 1px solid transparent; background: #161a24; cursor: pointer; font-size: 14px; padding: 7px 10px; }
      #preset-list button:hover:not(:disabled) { background: #20263a; }
      #preset-list button:disabled { opacity: 0.3; cursor: default; }
      #preset-list .pick { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #preset-list .num { display: inline-block; width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
      #preset-list li.active .pick { background: #1d3a5f; border-color: #2f5d93; font-weight: 600; }
      .preset-actions { display: flex; gap: 6px; padding: 8px; }
      .preset-actions button:disabled { opacity: 0.4; cursor: default; }
      .section { margin: 14px 12px 2px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      #stats { padding: 12px; font-size: 13px; line-height: 1.4; }
      #stats table { border-collapse: collapse; width: 100%; }
      #stats td { padding: 2px 0; vertical-align: top; }
      #stats td:first-child { color: var(--muted); white-space: nowrap; padding-right: 10px; }
      #stats ul { margin: 8px 0 0; padding-left: 16px; color: var(--warn); }
      #stats li { margin-bottom: 4px; }
      @media (max-width: 699px) {
        #panel { top: auto; left: 0; width: auto; height: 62dvh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4); transform: translateY(100%); }
        body.panel-open #ride { display: none; }
        #panel-toggle { top: calc(var(--view-top, 0px) + 8px); right: 8px; padding: 6px 10px; font-size: 13px; border-radius: 8px; }
      }
      @media (pointer: coarse) {
        #panel header button, .preset-actions button, #preset-list button, #ride button { min-height: 40px; }
        #preset-list button:not(.pick) { min-width: 40px; }
      }

      /* lil-gui inside the tabs: full width, no title bar of its own, larger text. 'body' outranks lil-gui's own rules. */
      body .lil-gui { --font-size: 14px; --input-font-size: 14px; --widget-height: 26px; --padding: 6px; --spacing: 6px; --name-width: 45%; --slider-input-min-width: 52px; --background-color: transparent; --title-background-color: #161a24; }
      body .pane .lil-gui.root { --width: 100%; width: 100%; }
      body .pane .lil-gui.root > .title { display: none; }
      body .lil-gui .lil-gui > .title { font-size: 14px; }
      @media (pointer: coarse) { body .lil-gui { --input-font-size: 16px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="buffer"><div>Firmware column buffer (x = column, y = strip/LED)</div><canvas></canvas></div>
    <div id="strip-frame" hidden><span>Roadside</span></div>
    <div id="ride">
      <div class="row">
        <button id="preset-name" type="button" title="Edit presets">Preset</button>
        <span id="preset-count"></span>
        <button id="preset-next" type="button" title="Next preset (N): the wheel's button">Next ▶</button>
        <button id="ride-brake" type="button">Brake</button>
        <button id="ride-go" type="button">Ride</button>
        <label><input id="ride-city" type="checkbox" /> Stop-and-go</label>
      </div>
      <div class="row">
        <span id="ride-speed">0.0</span><span id="ride-unit">mph</span>
        <input id="ride-slider" type="range" min="0" max="40" step="0.5" aria-label="Bicycle speed" />
        <span id="ride-status"></span>
      </div>
    </div>
    <button id="panel-toggle" type="button" aria-controls="panel" aria-expanded="false">⚙️ Settings</button>
    <aside id="panel" aria-label="Settings">
      <header>
        <span class="label">Setup</span>
        <button id="setup-reset" type="button" title="Start over with the default hardware, built-in presets and simulator settings">Reset</button>
        <button id="setup-open" type="button" title="Open a setup file">Open</button>
        <button id="setup-save" type="button" title="Download the hardware and presets as a setup file">Save</button>
        <button id="panel-close" type="button" aria-label="Close settings">✕</button>
      </header>
      <nav role="tablist">
        <button type="button" role="tab" data-tab="presets">Presets</button>
        <button type="button" role="tab" data-tab="hardware">Hardware</button>
        <button type="button" role="tab" data-tab="simulator">Simulator</button>
        <button type="button" role="tab" data-tab="stats">Stats</button>
      </nav>
      <div class="pane" data-pane="presets" role="tabpanel">
        <ol id="preset-list"></ol>
        <div class="preset-actions">
          <button id="preset-add" type="button">＋ New preset</button>
          <button id="preset-delete" type="button">Delete</button>
        </div>
        <div class="section">Selected preset</div>
        <div class="gui"></div>
      </div>
      <div class="pane" data-pane="hardware" role="tabpanel">
        <div class="gui"></div>
      </div>
      <div class="pane" data-pane="simulator" role="tabpanel">
        <p class="hint">How the simulation looks and rides. Not part of the setup.</p>
        <div class="gui"></div>
      </div>
      <div class="pane" data-pane="stats" role="tabpanel">
        <div id="stats"></div>
      </div>
      <footer><a href="https://github.com/adamburr/pov-wheel-sim" target="_blank" rel="noopener">Source on GitHub ↗</a></footer>
    </aside>
    <div id="toast" role="status" hidden></div>
    <div id="drop">Drop an image, clip or setup file</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
